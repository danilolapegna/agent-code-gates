name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: node --test

  gates:
    runs-on: ubuntu-latest
    steps:
      # The gates diff a commit against its parent, so a shallow clone will not do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the gates against the head commit
        run: node bin/agent-code-gates.js --commit ${{ github.event.pull_request.head.sha || github.sha }}
